name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x

    - name: Verify Backend Syntax
      run: |
        cd backend
        npm install --legacy-peer-deps
        node --check index.js

    - name: Test Frontend Build
      run: |
        cd frontend
        npm install --legacy-peer-deps
        CI=false npm run build
